<svg width="700" height="480" viewBox="0 0 380 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Aeroshell多协议整合示意图</title>
<desc>展示Aeroshell作为中心工具整合SSH、SFTP、VNC、Redis和数据库管理五种协议于一个界面</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="140" y="106" width="100" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="190" y="130" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Aeroshell</text>

<line x1="140" y1="120" x2="60" y2="40" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="150" y1="106" x2="120" y2="30" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="230" y1="106" x2="260" y2="30" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="240" y1="120" x2="320" y2="40" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="190" y1="154" x2="190" y2="220" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="16" y="10" width="80" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="27" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">SSH</text>

<rect x="90" y="4" width="80" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="21" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">SFTP</text>

<rect x="222" y="4" width="80" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="262" y="21" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">VNC</text>

<rect x="288" y="10" width="80" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="328" y="27" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Redis</text>

<rect x="130" y="222" width="120" height="34" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="190" y="239" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#2C2C2A">数据库管理</text>
</svg>
