<svg width="700" height="315" viewBox="0 0 380 170" xmlns="http://www.w3.org/2000/svg" role="img">
<title>frp内网穿透原理示意图</title>
<desc>展示内网设备通过frpc客户端连接到公网VPS上的frps服务端，外部用户经由VPS访问到内网服务的完整链路</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="10" y="66" width="90" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="55" y="86" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">内网设备</text>
<text x="55" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">frpc</text>

<line x1="100" y1="86" x2="150" y2="86" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="150" y="66" width="90" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="195" y="86" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">VPS公网IP</text>
<text x="195" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">frps</text>

<line x1="240" y1="86" x2="290" y2="86" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="290" y="66" width="80" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="330" y="86" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">外部用户</text>
</svg>
