<svg width="700" height="480" viewBox="0 0 380 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>VPS一键管理脚本常见功能分类示意图</title>
<desc>展示VPS一键管理脚本通常打包的四类功能：系统信息查看、常用软件安装、安全加固、清理维护</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="130" y="106" width="120" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="190" y="130" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">一键管理脚本</text>

<line x1="140" y1="120" x2="55" y2="35" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="160" y1="106" x2="140" y2="30" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="220" y1="106" x2="240" y2="30" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="240" y1="120" x2="325" y2="35" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="10" y="6" width="90" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="55" y="23" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">系统信息</text>

<rect x="94" y="0" width="92" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="140" y="17" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">软件安装</text>

<rect x="194" y="0" width="92" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="240" y="17" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">安全加固</text>

<rect x="280" y="6" width="90" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="325" y="23" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">清理维护</text>
</svg>
