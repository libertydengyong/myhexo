<svg width="700" height="350" viewBox="0 0 380 190" xmlns="http://www.w3.org/2000/svg" role="img">
<title>BBR优化前后延迟对比示意图</title>
<desc>横向条形示意图，展示开启BBR优化前延迟较高，优化后延迟明显降低的对比关系</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="95" y="64" text-anchor="end" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#2C2C2A">优化前</text>
<rect x="100" y="50" width="220" height="28" rx="4" fill="#E24B4A"/>
<text x="310" y="64" text-anchor="end" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#ffffff">延迟较高</text>

<line x1="210" y1="82" x2="210" y2="106" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="95" y="124" text-anchor="end" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#2C2C2A">优化后</text>
<rect x="100" y="110" width="110" height="28" rx="4" fill="#1D9E75"/>
<text x="200" y="124" text-anchor="end" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#ffffff">延迟降低</text>

<text x="190" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">示意图，实际提升幅度因线路和网络环境而异</text>
</svg>
