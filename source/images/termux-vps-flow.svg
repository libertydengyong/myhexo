<svg width="700" height="850" viewBox="0 0 380 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>手机Termux远程管理VPS流程图</title>
<desc>展示手机通过Termux安装SSH客户端，经过密钥认证和连接加速，最终远程管理VPS服务器，并通过Git同步代码配置的完整流程</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="90" y="40" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="190" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">手机 Termux</text>
<text x="190" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">安装SSH客户端</text>

<line x1="190" y1="96" x2="190" y2="150" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="200" y="123" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5F5E5A">密钥认证</text>

<rect x="90" y="150" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="190" y="168" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">SSH / Mosh 连接</text>
<text x="190" y="186" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">连接复用 + 加速</text>

<line x1="190" y1="206" x2="190" y2="260" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="200" y="233" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5F5E5A">远程执行</text>

<rect x="90" y="260" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="190" y="278" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">VPS 服务器</text>
<text x="190" y="296" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">部署、管理、维护</text>

<line x1="190" y1="316" x2="190" y2="360" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="200" y="343" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5F5E5A">Git同步</text>

<rect x="70" y="360" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="190" y="378" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">代码 / 配置文件</text>
<text x="190" y="396" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">GitHub仓库中转同步</text>
</svg>
