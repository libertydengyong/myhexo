<svg width="700" height="433" viewBox="0 0 380 235" xmlns="http://www.w3.org/2000/svg" role="img">
<title>模拟定位软件工作原理示意图</title>
<desc>展示手机真实位置和App设置的模拟位置两个坐标点，以及手机最终上报模拟坐标的过程</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="380" height="235" rx="12" fill="#EFF3EC"/>

<circle cx="100" cy="70" r="14" fill="#9B9A93"/>
<path d="M90 80 L100 104 L110 80 Z" fill="#9B9A93"/>
<circle cx="100" cy="70" r="5" fill="#ffffff"/>
<text x="100" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">真实位置</text>

<circle cx="280" cy="70" r="14" fill="#1D9E75"/>
<path d="M270 80 L280 104 L290 80 Z" fill="#1D9E75"/>
<circle cx="280" cy="70" r="5" fill="#ffffff"/>
<text x="280" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">模拟位置</text>
<text x="280" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">（App设置）</text>

<line x1="118" y1="70" x2="262" y2="70" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

<rect x="170" y="150" width="40" height="64" rx="6" fill="#2C2C2A"/>
<rect x="175" y="158" width="30" height="48" rx="3" fill="#ffffff"/>
<circle cx="190" cy="180" r="4" fill="#1D9E75"/>

<text x="190" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">手机实际上报的是模拟坐标</text>
</svg>
