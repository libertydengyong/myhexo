<svg width="700" height="748" viewBox="0 0 380 406" xmlns="http://www.w3.org/2000/svg" role="img">
<title>SSH断线与Mosh保持连接对比图</title>
<desc>两台手机终端界面对比：左侧普通SSH在网络切换后显示连接已断开需要重新登录，右侧Mosh在网络切换后显示会话已恢复命令还在</desc>

<text x="100" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">普通 SSH</text>
<text x="280" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Mosh</text>

<rect x="20" y="40" width="160" height="340" rx="16" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<rect x="200" y="40" width="160" height="340" rx="16" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>

<rect x="85" y="48" width="30" height="6" rx="3" fill="#B4B2A9"/>
<rect x="265" y="48" width="30" height="6" rx="3" fill="#B4B2A9"/>

<rect x="28" y="64" width="144" height="260" rx="8" fill="#1b1e23"/>
<rect x="208" y="64" width="144" height="260" rx="8" fill="#1b1e23"/>

<text x="36" y="84" font-family="monospace" font-size="11" fill="#d0d0d0">$ ssh root@vps</text>
<text x="36" y="104" font-family="monospace" font-size="11" fill="#8fd7a4">Connected.</text>
<text x="36" y="124" font-family="monospace" font-size="11" fill="#d0d0d0">$ git pull</text>
<text x="36" y="144" font-family="monospace" font-size="11" fill="#8fd7a4">Already up to date.</text>

<text x="216" y="84" font-family="monospace" font-size="11" fill="#d0d0d0">$ mosh root@vps</text>
<text x="216" y="104" font-family="monospace" font-size="11" fill="#8fd7a4">Connected.</text>
<text x="216" y="124" font-family="monospace" font-size="11" fill="#d0d0d0">$ git pull</text>
<text x="216" y="144" font-family="monospace" font-size="11" fill="#8fd7a4">Already up to date.</text>

<rect x="28" y="170" width="144" height="154" fill="#3a1313"/>
<circle cx="100" cy="220" r="22" fill="#7a2020"/>
<line x1="91" y1="211" x2="109" y2="229" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
<line x1="91" y1="229" x2="109" y2="211" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
<text x="100" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff">连接已断开</text>
<text x="100" y="286" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e0a3a3">需要重新登录</text>

<rect x="208" y="170" width="144" height="154" fill="#0f2b24"/>
<circle cx="280" cy="220" r="22" fill="#1d6b52"/>
<path d="M270 220L278 229L292 211" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="280" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff">会话已恢复</text>
<text x="280" y="286" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9fd9c4">命令还在</text>
</svg>
