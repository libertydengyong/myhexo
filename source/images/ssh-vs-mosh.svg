<svg width="700" height="888" viewBox="0 0 380 482" xmlns="http://www.w3.org/2000/svg" role="img">
<title>SSH断线与Mosh保持连接对比图</title>
<desc>两台手机终端界面对比：左侧普通SSH在网络切换后显示连接已断开需要重新登录，右侧Mosh在网络切换后显示会话已恢复命令还在</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="100" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">普通 SSH</text>
<text x="280" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Mosh</text>

<rect x="20" y="40" width="160" height="380" rx="16" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<rect x="200" y="40" width="160" height="380" rx="16" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>

<rect x="85" y="48" width="30" height="6" rx="3" fill="#B4B2A9"/>
<rect x="265" y="48" width="30" height="6" rx="3" fill="#B4B2A9"/>

<rect x="28" y="64" width="144" height="300" rx="8" fill="#1b1e23"/>
<rect x="208" y="64" width="144" height="300" rx="8" fill="#1b1e23"/>

<text x="36" y="84" font-family="monospace" font-size="11" fill="#d0d0d0">$ ssh root@vps</text>
<text x="36" y="104" font-family="monospace" font-size="11" fill="#8fd7a4">Connected.</text>
<text x="36" y="124" font-family="monospace" font-size="11" fill="#d0d0d0">$ cd myhexo</text>
<text x="36" y="144" font-family="monospace" font-size="11" fill="#d0d0d0">$ git pull</text>
<text x="36" y="164" font-family="monospace" font-size="11" fill="#8fd7a4">Already up to date.</text>
<text x="36" y="184" font-family="monospace" font-size="11" fill="#d0d0d0">$ npx hexo generate</text>
<text x="36" y="204" font-family="monospace" font-size="11" fill="#8fd7a4">Done in 3.2s</text>

<text x="216" y="84" font-family="monospace" font-size="11" fill="#d0d0d0">$ mosh root@vps</text>
<text x="216" y="104" font-family="monospace" font-size="11" fill="#8fd7a4">Connected.</text>
<text x="216" y="124" font-family="monospace" font-size="11" fill="#d0d0d0">$ cd myhexo</text>
<text x="216" y="144" font-family="monospace" font-size="11" fill="#d0d0d0">$ git pull</text>
<text x="216" y="164" font-family="monospace" font-size="11" fill="#8fd7a4">Already up to date.</text>
<text x="216" y="184" font-family="monospace" font-size="11" fill="#d0d0d0">$ npx hexo generate</text>
<text x="216" y="204" font-family="monospace" font-size="11" fill="#8fd7a4">Done in 3.2s</text>

<rect x="28" y="250" width="144" height="114" fill="#3a1313"/>
<circle cx="100" cy="285" r="20" fill="#7a2020"/>
<line x1="92" y1="277" x2="108" y2="293" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<line x1="92" y1="293" x2="108" y2="277" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="326" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#ffffff">连接已断开</text>
<text x="100" y="344" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e0a3a3">需要重新登录</text>

<rect x="208" y="250" width="144" height="114" fill="#0f2b24"/>
<circle cx="280" cy="285" r="20" fill="#1d6b52"/>
<path d="M271 285L278 293L290 277" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="280" y="326" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#ffffff">会话已恢复</text>
<text x="280" y="344" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9fd9c4">命令还在</text>

<rect x="20" y="432" width="160" height="30" rx="8" fill="#FBE7E4" stroke="#B23A2E" stroke-width="0.5"/>
<text x="100" y="447" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#8C2A20">网络切换后失联</text>

<rect x="200" y="432" width="160" height="30" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="280" y="447" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">网络切换后自愈</text>
</svg>
