# Hexo Configuration
title: FreedomGPT
url: https://www.freedomgpt.top
root: /
permalink: :year/:month/:day/:title/
tag_dir: tags
archive_dir: archives
category_dir: categories

# 核心：必须跳过渲染，否则 XML 会被 Hexo 破坏
skip_render:
  - "sitemap.xml"

# 关键：映射旧分类
category_map:
  "vps技巧": vps

# 核心：确保主题存在
theme: next

# 基础环境配置
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
