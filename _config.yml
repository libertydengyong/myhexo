# Hexo Configuration
url: https://www.freedomgpt.top
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# 关键：跳过对 sitemap.xml 的渲染，直接搬运
skip_render:
  - "sitemap.xml"

# 关键：分类名映射
category_map:
  "vps技巧": vps

# 其他基础配置
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
default_layout: post
title: FreedomGPT
